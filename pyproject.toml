[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carrier-desk"
version = "0.1.0"
description = "Backend service for the inbound carrier sales voice agent (HappyRobot FDE challenge)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Not used by phase 1 yet; listed here because they are the documented
    # stack for the HTTP API (phase 3) and the FMCSA client (phase 2).
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# The project is not installed into the venv; these paths make `app` and the
# test helpers importable when running `pytest` from the repository root.
pythonpath = [".", "tests", "scripts"]
testpaths = ["tests"]
addopts = "-q"
